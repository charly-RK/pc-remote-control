name: remote_pc
description: "Remote control for your PC from your phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.0.0
  mobile_scanner: ^5.1.0
  nsd: ^4.0.0
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
